<!doctype html>
<!-- The agent panel (design 0021 §4), beside the agent's terminal, drawn as the owner chose it (direction A, "Quiet",
     2026-10-26). The extension fills in the {{...}} fields: the content security policy's sources, the nonce of the
     scripts, and the addresses of the style sheets and scripts (marked and KaTeX are the artifacts' libraries, decision
     0135). KaTeX writes its layout in style attributes, so the policy lets styles be inline; no script runs but those
     carrying the nonce, and nothing comes from the network. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{source}} 'unsafe-inline'; font-src {{source}}; img-src {{source}} data:; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{katexCss}}" />
    <link rel="stylesheet" href="{{css}}" />
    <title>Clank · agent</title>
  </head>
  <body>
    <header class="head">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <div class="heading">
        <span id="title" class="title">Reading the conversation…</span>
        <span id="subtitle" class="subtitle"></span>
      </div>
      <div class="tools">
        <button class="icon" data-act="sessions" aria-label="Sessions of this folder" title="Sessions of this folder">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"></path><path d="M2.5 2.5v2.5H5"></path><path d="M8 5v3l2 1.5"></path></svg>
        </button>
        <button class="icon" data-act="new" aria-label="New session" title="New session: the next message starts it">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        </button>
        <button class="icon" data-act="compact" aria-label="Compact the conversation" title="Compact the conversation at the next step">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h3V3M13 6h-3V3M3 10h3v3M13 10h-3v3"></path></svg>
        </button>
        <button class="icon" data-act="terminal" aria-label="Show in OpenCode's terminal" title="Show this session in OpenCode's terminal">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"></rect><path d="M4.5 6l2 2-2 2M8.5 10.5h3"></path></svg>
        </button>
      </div>
    </header>
    <div class="stage">
      <main id="conversation">
        <button id="older" class="older" hidden>Show older messages</button>
        <div id="items" class="items"></div>
      </main>
      <button id="new" class="new" hidden>new ↓</button>
    </div>
    <div id="foot" class="foot" hidden>
      <span id="foot-dot" class="dot small" aria-hidden="true"></span>
      <span id="speed"></span>
      <span class="context"><span id="used"></span><span class="meter" aria-hidden="true"><span id="meter"></span></span></span>
      <span id="drafts"></span>
      <span id="gpu" class="right"></span>
    </div>
    <footer class="composer-wrap">
      <div id="files" class="files" hidden></div>
      <div class="composer">
        <label for="input" class="unseen">Write to the agent</label>
        <textarea
          id="input"
          rows="2"
          placeholder="Write to the agent. @ names a file; an image can be pasted."
        ></textarea>
        <div class="composer-row">
          <button class="icon" id="at" aria-label="Name a file" title="Name a file (@)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5"></circle><path d="M10.5 8v1.2a1.8 1.8 0 0 0 3.5 0V8a6 6 0 1 0-2.4 4.8"></path></svg>
          </button>
          <button class="icon" id="image" aria-label="Add an image" title="Add an image for the agent to look at">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"></rect><circle cx="5.5" cy="6.5" r="1.3"></circle><path d="M14.5 11l-3.5-3.5L4 13.5"></path></svg>
          </button>
          <span id="model" class="model"></span>
          <button id="send" class="send" aria-label="Send" title="Send (Enter)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path id="send-icon" d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg>
          </button>
        </div>
      </div>
    </footer>
    <script nonce="{{nonce}}" src="{{marked}}"></script>
    <script nonce="{{nonce}}" src="{{katex}}"></script>
    <script nonce="{{nonce}}" src="{{script}}"></script>
  </body>
</html>
