<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Clank</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <button id="back" class="back hidden" aria-label="Back">‹</button>
    <span class="brand">◆ CLANK</span>
    <span id="title" class="where"></span>
    <span id="status" class="status"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" class="tabs hidden">
    <button data-tab="now" class="on">now<span class="count" id="count-now"></span></button>
    <button data-tab="work">work</button>
    <button data-tab="files">files</button>
    <button data-tab="log">log</button>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
