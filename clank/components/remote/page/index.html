<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clank">
  <title>Clank</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <button id="back" class="back hidden" aria-label="Back">‹</button>
    <span class="brand">◆ CLANK</span>
    <span id="machine" class="where"></span>
    <span id="status" class="status"></span>
  </header>
  <div id="attention" class="attention hidden" role="status"></div>
  <main id="view" aria-live="polite">
    <div class="center launch" id="launch">
      <div class="brand">◆ CLANK</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="step" id="launch-step">Reaching the PC through Tailscale…</div>
      <div class="dim" id="launch-time"></div>
    </div>
  </main>
  <nav id="tabs" class="tabs hidden">
    <button data-tab="now" class="on">Now<span class="count" id="count-now"></span></button>
    <button data-tab="flows">Flows</button>
    <button data-tab="work">Work</button>
    <button data-tab="files">Files</button>
    <button data-tab="more">More</button>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
